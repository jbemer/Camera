name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Clé de debug fixe : chaque APK est signé pareil, on peut installer par-dessus l'ancien.
      - name: Install fixed debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::warning::Secret DEBUG_KEYSTORE_BASE64 absent : l'APK sera signé avec une clé aléatoire."
            exit 0
          fi
          KS="$HOME/.android/debug.keystore"
          mkdir -p "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$KS"
          # Le build debug attend l'alias "androiddebugkey" (mot de passe "android").
          ALIAS=$(keytool -list -keystore "$KS" -storetype PKCS12 -storepass android | grep -i 'PrivateKeyEntry' | head -n1 | cut -d, -f1)
          if [ -z "$ALIAS" ]; then
            echo "::error::Aucune clé privée trouvée dans le secret DEBUG_KEYSTORE_BASE64."
            exit 1
          fi
          if [ "$ALIAS" != "androiddebugkey" ]; then
            keytool -changealias -keystore "$KS" -storetype PKCS12 -storepass android \
              -alias "$ALIAS" -destalias androiddebugkey
          fi
          keytool -list -v -keystore "$KS" -storetype PKCS12 -storepass android | grep -E 'Alias|SHA256:'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew assembleFossDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: fossify-camera-debug-apk
          path: app/build/outputs/apk/foss/debug/*.apk
